default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff
        language: unsupported
        name: Ruff
        files: '.+\.py$'
        entry: ruff check
        verbose: true

      - id: mypy
        language: unsupported
        name: Mypy
        files: '.+\.py$'
        entry: mypy .
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [pre-push]

      - id: pytest
        language: unsupported
        name: Pytest
        entry: pytest
        pass_filenames: false
        always_run: true
        stages: [pre-push]
